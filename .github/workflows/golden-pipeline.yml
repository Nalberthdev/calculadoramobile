name: Golden Pipeline

# Workflow reutilizável: valida o projeto (lint e build).
# Adaptado da apostila do Backstage FATEC para o app Expo da calculadora.

on:
  workflow_call:
    inputs:
      node-version:
        description: Versão do Node.js
        type: string
        default: "22"
      working-directory:
        description: Pasta onde está o package.json do app
        type: string
        default: Calculadora

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
